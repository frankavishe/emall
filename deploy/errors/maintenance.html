<!doctype html>
<!-- Served by Caddy when the frontend container is unreachable (502/503/504).
     Self-contained on purpose: no app assets are available when this shows. Colors mirror
     frontend/src/app/globals.css. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>We'll be right back · E-Mall</title>
    <style>
      :root {
        --canvas: #f3f4f6;
        --card: #ffffff;
        --border: rgb(15 23 42 / 8%);
        --text: #0f172a;
        --muted: #6b7280;
        --brand: #0f2a4a;
        --teal: #2dd4bf;
        --primary-bg: #0f2a4a;
        --primary-text: #ffffff;
        --shadow: 0 1px 2px rgb(15 23 42 / 4%), 0 8px 24px rgb(15 23 42 / 6%);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #0b1220;
          --card: #111a2e;
          --border: rgb(255 255 255 / 8%);
          --text: #e2e8f0;
          --muted: #94a3b8;
          --brand: #5eead4;
          --primary-bg: #1d4370;
          --primary-text: #ffffff;
          --shadow: 0 1px 2px rgb(0 0 0 / 30%), 0 8px 24px rgb(0 0 0 / 30%);
        }
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 64px 16px;
        background: var(--canvas);
        color: var(--text);
        font-family:
          "Geist",
          ui-sans-serif,
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          Arial,
          sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 32rem;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        padding: 40px 24px;
        text-align: center;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 20px;
        box-shadow: var(--shadow);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        font-weight: 600;
        color: var(--brand);
      }
      .brand span {
        width: 10px;
        height: 10px;
        border-radius: 2px;
        background: var(--teal);
      }
      .code {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
        font-size: 56px;
        font-weight: 700;
        letter-spacing: -0.02em;
        color: var(--brand);
      }
      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 600;
      }
      p {
        margin: 0;
        max-width: 24rem;
        font-size: 14px;
        line-height: 1.5;
        color: var(--muted);
      }
      .btn {
        margin-top: 8px;
        display: inline-flex;
        padding: 8px 16px;
        border-radius: 9999px;
        font-size: 14px;
        font-weight: 500;
        text-decoration: none;
        background: var(--primary-bg);
        color: var(--primary-text);
      }
      .btn:hover {
        opacity: 0.9;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand"><span aria-hidden="true"></span>E-Mall</div>
      <p class="code">503</p>
      <h1>We'll be right back</h1>
      <p>
        E-Mall is briefly unavailable while we update things. Please try again
        in a few minutes.
      </p>
      <a class="btn" href="">Refresh</a>
    </main>
  </body>
</html>
