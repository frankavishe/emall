name: CI/CD

on:
  pull_request:
    branches: [development, staging, main]
  push:
    branches: [development, staging, main]

concurrency:
  group: pipeline-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/${{ github.repository_owner }}/emall-backend
  FRONTEND_IMAGE: ghcr.io/${{ github.repository_owner }}/emall-frontend

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
            frontend:
              - 'frontend/**'

  backend-test:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: emall
          POSTGRES_PASSWORD: emall_ci_password
          POSTGRES_DB: emall
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgres://emall:emall_ci_password@localhost:5432/emall
      SECRET_KEY: ci-test-secret-key-not-for-production
      DEBUG: "True"
      ALLOWED_HOSTS: localhost,127.0.0.1
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
      DEFAULT_FROM_EMAIL: no-reply@emall.local
      ACCESS_TOKEN_LIFETIME_MINUTES: "15"
      REFRESH_TOKEN_LIFETIME_DAYS: "7"
      ADMIN_SEED_EMAIL: admin@emall.local
      ADMIN_SEED_PASSWORD: ci-placeholder-password
      ADMIN_SEED_NAME: CI Admin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: ruff check .
      - run: pytest

  frontend-check:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build

  backend-image:
    needs: backend-test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          case "${{ github.ref_name }}" in
            development) prefix=dev ;;
            staging) prefix=staging ;;
            main) prefix=prod ;;
          esac
          sha_short=$(echo "${{ github.sha }}" | cut -c1-7)
          tags="${{ env.BACKEND_IMAGE }}:${prefix}-${sha_short}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            tags="${tags},${{ env.BACKEND_IMAGE }}:latest"
          else
            tags="${tags},${{ env.BACKEND_IMAGE }}:${prefix}-latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}

  frontend-image:
    needs: frontend-check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Compute image tags
        id: tags
        shell: bash
        run: |
          case "${{ github.ref_name }}" in
            development) prefix=dev ;;
            staging) prefix=staging ;;
            main) prefix=prod ;;
          esac
          sha_short=$(echo "${{ github.sha }}" | cut -c1-7)
          tags="${{ env.FRONTEND_IMAGE }}:${prefix}-${sha_short}"
          if [ "${{ github.ref_name }}" = "main" ]; then
            tags="${tags},${{ env.FRONTEND_IMAGE }}:latest"
          else
            tags="${tags},${{ env.FRONTEND_IMAGE }}:${prefix}-latest"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=http://localhost:8000

  # Single required status check for branch protection on `development`. backend-test and
  # frontend-check are path-filtered (skipped when that half of the repo didn't change), and
  # a required check that never reports is left "pending" forever by GitHub - so protection
  # points at this always-running gate instead, which passes as long as neither real job
  # failed.
  pr-checks-ok:
    if: always() && github.event_name == 'pull_request'
    needs: [backend-test, frontend-check]
    runs-on: ubuntu-latest
    steps:
      - name: Require backend-test and frontend-check to have passed or been skipped
        run: |
          if [ "${{ needs.backend-test.result }}" == "failure" ] || [ "${{ needs.frontend-check.result }}" == "failure" ]; then
            echo "A required check failed."
            exit 1
          fi

  # feature/* -> development: once a PR's required checks pass and it has the required
  # approval, GitHub's native auto-merge completes the merge for us. This just flips that
  # flag on; it does not bypass required status checks or reviews (see branch protection on
  # `development`). The enablePullRequestAutoMerge mutation is rejected for the default
  # GITHUB_TOKEN ("Resource not accessible by integration") regardless of granted
  # permissions, so this reuses PROMOTION_PAT (needs "Pull requests: Read and write" on top
  # of its Contents/Workflows scopes).
  enable-auto-merge:
    if: github.event_name == 'pull_request' && github.event.pull_request.base.ref == 'development'
    runs-on: ubuntu-latest
    steps:
      - name: Enable auto-merge
        env:
          GH_TOKEN: ${{ secrets.PROMOTION_PAT }}
        run: gh pr merge --auto --squash "${{ github.event.pull_request.number }}" --repo "${{ github.repository }}"

  # development -> staging: resets staging to development once development's own
  # push-triggered checks/images have succeeded. This push (via PROMOTION_PAT, since the
  # default GITHUB_TOKEN can't trigger downstream workflow runs) is what starts the staging
  # pipeline below.
  #
  # staging/main are pure mirrors with no history of their own, so this force-pushes
  # development's tip onto staging rather than `merge --ff-only`. A `--ff-only` merge fails
  # the moment staging picks up even one commit development doesn't have (e.g. a direct push,
  # or a manual "reconcile" merge like the one that broke promotion for PR #27 and again
  # ahead of PR #30) — `reset --hard` makes that failure mode structurally impossible instead
  # of requiring another manual reconcile each time it happens.
  promote-to-staging:
    needs: [backend-image, frontend-image]
    if: |
      always() &&
      github.event_name == 'push' && github.ref_name == 'development' &&
      (needs.backend-image.result == 'success' || needs.backend-image.result == 'skipped') &&
      (needs.frontend-image.result == 'success' || needs.frontend-image.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTION_PAT }}
      - name: Reset staging to development
        run: |
          git config user.name "emall-ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git fetch origin development
          git push origin origin/development:refs/heads/staging --force

  # staging pipeline: deploys the just-built staging images and runs the Playwright smoke
  # suite against them. No real staging host exists yet, so "deploy" is a docker-compose
  # stack stood up on this runner (docker-compose.staging.yml) — swap that step for a real
  # deploy later; only PLAYWRIGHT_BASE_URL needs to change to point at the real host.
  staging-e2e:
    needs: [backend-image, frontend-image]
    if: |
      always() &&
      github.event_name == 'push' && github.ref_name == 'staging' &&
      (needs.backend-image.result == 'success' || needs.backend-image.result == 'skipped') &&
      (needs.frontend-image.result == 'success' || needs.frontend-image.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      PLAYWRIGHT_BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy staging-simulation stack
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
        run: |
          docker compose -f docker-compose.staging.yml pull
          docker compose -f docker-compose.staging.yml up -d
      - name: Wait for stack to be healthy
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/api/catalog/products > /dev/null && curl -sf http://localhost:3000 > /dev/null; then
              echo "Stack is up"
              exit 0
            fi
            sleep 5
          done
          echo "Staging-simulation stack did not become healthy in time"
          docker compose -f docker-compose.staging.yml logs
          exit 1
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - working-directory: frontend
        run: npm ci
      - working-directory: frontend
        run: npx playwright install --with-deps chromium
      - working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7
      - name: Tear down staging-simulation stack
        if: always()
        run: docker compose -f docker-compose.staging.yml down -v

  # staging -> main: only reached once staging-e2e succeeds. No PR, no approval - the E2E
  # pass on staging is the gate. Resets main to staging for the same reason promote-to-staging
  # resets staging to development above (see that job's comment).
  promote-to-main:
    needs: staging-e2e
    if: |
      always() &&
      github.event_name == 'push' && github.ref_name == 'staging' &&
      needs.staging-e2e.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTION_PAT }}
      - name: Reset main to staging
        run: |
          git config user.name "emall-ci-bot"
          git config user.email "ci-bot@users.noreply.github.com"
          git fetch origin staging
          git push origin origin/staging:refs/heads/main --force
