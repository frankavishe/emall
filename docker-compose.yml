services:
  db:
    image: postgres:16
    container_name: emall-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: emall
      POSTGRES_PASSWORD: emall_dev_password
      POSTGRES_DB: emall
    ports:
      # Host 5433 -> container 5432, to avoid clashing with any local Postgres install
      - "5433:5432"
    volumes:
      - emall_pg_data:/var/lib/postgresql/data

  # MinIO no longer publishes public images (minio/minio and minio/mc are gone from Docker Hub
  # and Quay), so use Chainguard's builds. The -dev tags include sh/wget, which the
  # healthcheck and minio-init script below need.
  minio:
    image: cgr.dev/chainguard/minio:latest-dev
    container_name: emall-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: emall-minio
      MINIO_ROOT_PASSWORD: emall_dev_password
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      # Not the old emall_minio_data volume: the Chainguard build runs as non-root and doesn't
      # read that volume's root-owned on-disk format.
      - emall_minio_store:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 emall-minio emall_dev_password &&
      mc mb -p local/emall-media &&
      mc anonymous set download local/emall-media
      "

volumes:
  emall_pg_data:
  emall_minio_store:
